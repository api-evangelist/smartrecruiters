aid: smartrecruiters
name: SmartRecruiters
description: >-
  SmartRecruiters is a talent acquisition platform that provides a comprehensive suite of APIs for recruiting, hiring,
  and workforce management. The platform enables organizations to manage job postings, candidate applications,
  assessments, interviews, and offers through a unified REST API ecosystem.
